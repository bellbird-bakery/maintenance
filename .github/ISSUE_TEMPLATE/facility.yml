name: Facility Issue
description: Report a building or facility problem
labels: ["facility", "submitted"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: "e.g. Customer entrance, Cold room, Roof"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      placeholder: "Describe the issue briefly"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "Low"
        - "Medium"
        - "High"
        - "Urgent"
    validations:
      required: true
