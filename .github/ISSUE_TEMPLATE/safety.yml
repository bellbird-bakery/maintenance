name: Safety Concern
description: Report a safety hazard — if there is immediate danger, tell a manager first
labels: ["safety", "submitted", "priority: urgent"]
body:
  - type: markdown
    attributes:
      value: "**If there is immediate danger, tell a manager now. Use this form to create a written record.**"
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: "e.g. Kitchen floor, Loading dock"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is the hazard?
      placeholder: "Describe the risk briefly"
    validations:
      required: true
  - type: textarea
    id: action_taken
    attributes:
      label: Action already taken
      placeholder: "e.g. Area cordoned off, Manager notified"
