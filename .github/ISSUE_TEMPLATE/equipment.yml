name: Equipment Issue
description: Report a problem with a piece of bakery equipment
labels: ["equipment", "submitted"]
body:
  - type: input
    id: equipment
    attributes:
      label: Equipment
      placeholder: "e.g. Deck oven, Spiral mixer, Proofer"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: "e.g. Main kitchen, Cold room"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      placeholder: "Describe the issue briefly"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "Low"
        - "Medium"
        - "High"
        - "Urgent — out of action"
    validations:
      required: true
