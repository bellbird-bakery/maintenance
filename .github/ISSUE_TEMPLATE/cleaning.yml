name: Cleaning Task
description: Log a cleaning job that needs to be done
labels: ["cleaning", "submitted"]
body:
  - type: input
    id: area
    attributes:
      label: Area or equipment
      placeholder: "e.g. Mixer, Oven interiors, Cool room floor"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs doing?
      placeholder: "Describe the cleaning task briefly"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "Low — when convenient"
        - "Medium — this week"
        - "High — as soon as possible"
    validations:
      required: true
